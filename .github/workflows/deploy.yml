name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let an in-progress run finish rather
# than cancelling it mid-publish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          # withastro/action@v3 defaults to Node 20, older than Astro 7
          # requires (package.json pins engines.node >=22.23.4). "22"
          # resolved to 22.23.3 on GitHub's hosted runner image — one
          # patch behind, likely lag between a Node release and it
          # landing in the runner's cache. "24" is unambiguously past
          # the requirement regardless of exact patch availability.
          node-version: "24"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
